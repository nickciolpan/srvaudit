[package]
name = "srvaudit"
version = "0.1.1"
edition = "2024"
description = "Terminal audit dashboard for remote Linux servers: what listens, what runs, where the data is, what starts on its own."
license = "MIT"
readme = "README.md"
repository = "https://github.com/nickciolpan/srvaudit"
homepage = "https://nickciolpan.github.io/srvaudit/"
keywords = ["ssh", "audit", "tui", "sysadmin", "server"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
