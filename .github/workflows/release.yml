name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: srvaudit-darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: srvaudit-darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
          # musl so the Linux builds are static and run on any distro,
          # glibc version notwithstanding.
          - name: srvaudit-linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: srvaudit-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cp "target/${{ matrix.target }}/release/srvaudit" "${{ matrix.name }}"
          chmod +x "${{ matrix.name }}"
          tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}"
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"
          cat "${{ matrix.name }}.tar.gz.sha256"

      - name: Smoke test the binary we just built
        # An arm64 runner cannot run an amd64 binary, and vice versa.
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./${{ matrix.name }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        working-directory: dist
        run: |
          cat *.tar.gz.sha256 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --title "srvaudit $TAG" \
            --generate-notes \
            --verify-tag
